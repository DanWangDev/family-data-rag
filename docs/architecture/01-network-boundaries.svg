nts="1534.1946347717678,520.2195864093347 1545,515.0 1534.1946347717678,509.78041359066526" fill="none" stroke="#7852A6" stroke-width="2.2" /><polyline points="1045,625.0 1120,625.0" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1109.1946347717678,630.2195864093347 1120,625.0 1109.1946347717678,619.7804135906653" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="1390,625.0 1545,625.0" fill="none" stroke="#7852A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1534.1946347717678,630.2195864093347 1545,625.0 1534.1946347717678,619.7804135906653" fill="none" stroke="#7852A6" stroke-width="2.2" /><polyline points="1045,735.0 1120,735.0" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1109.1946347717678,740.2195864093347 1120,735.0 1109.1946347717678,729.7804135906653" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="1390,735.0 1545,735.0" fill="none" stroke="#7852A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1534.1946347717678,740.2195864093347 1545,735.0 1534.1946347717678,729.7804135906653" fill="none" stroke="#7852A6" stroke-width="2.2" /><polyline points="1045,845.0 1120,845.0" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1109.1946347717678,850.2195864093347 1120,845.0 1109.1946347717678,839.7804135906653" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="1390,845.0 1545,845.0" fill="none" stroke="#7852A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1534.1946347717678,850.2195864093347 1545,845.0 1534.1946347717678,839.7804135906653" fill="none" stroke="#7852A6" stroke-width="2.2" /><polyline points="290,430.0 355,430 425,430.0" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="414.1946347717679,435.21958640933474 425,430.0 414.1946347717679,424.78041359066526" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="610,430.0 695,430.0" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="684.1946347717678,435.21958640933474 695,430.0 684.1946347717678,424.78041359066526" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="857.5,525 857.5,600" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="852.2804135906653,589.1946347717678 857.5,600 862.7195864093347,589.1946347717678" fill="none" stroke="#2563A6" stroke-width="2.2" /><text x="55" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" text-anchor="start"><tspan x="55" y="68.52000000000001">01 / 网络与托管服务边界</tspan></text><text x="57" fill="#56667A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="start"><tspan x="57" y="118.47">AZURE 迁移建议 · 未部署    |    VNet 是网络边界；Private Link 不改变明文处理与数据驻留规则</tspan></text><text x="75" fill="#56667A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="75" y="255.54">本地 / 家庭网络</tspan></text><text x="365" fill="#56667A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="365" y="195.54">你的 Azure 订阅  /  资源归属、RBAC 与费用边界；不是网络边界</tspan></text><text x="400" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="400" y="260.54">你的 VNet  /  Azure 对应 VPC 的网络边界</tspan></text><text x="1535" fill="#7852A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="1535" y="260.54">微软托管服务域  /  VNet 外</tspan></text><text x="425" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="start"><tspan x="425" y="339.47">GatewaySubnet</tspan></text><text x="690" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="690" y="340.54">应用专用子网</tspan></text><text x="1110" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="start"><tspan x="1110" y="339.47">Private Endpoint 子网</tspan></text><text x="185.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="185.0" y="407.34000000000003">家庭设备 / NAS</tspan><tspan x="185.0" y="438.14">浏览器问答</tspan><tspan x="185.0" y="468.94">文档上传</tspan></text><text x="517.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="517.5" y="422.74">VPN Gateway</tspan><tspan x="517.5" y="453.53999999999996">加密隧道入口</tspan></text><text x="857.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="857.5" y="432.34000000000003">内部 Web / API</tspan><tspan x="857.5" y="463.14">问答 · 上传 · 引用下载</tspan><tspan x="857.5" y="493.94">身份验证 + 文档 ACL</tspan></text><text x="857.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="857.5" y="647.3399999999999">导入 Worker / Jobs</tspan><tspan x="857.5" y="678.14">解析 · OCR · 抽取</tspan><tspan x="857.5" y="708.9399999999999">切块 · 索引构建</tspan></text><text x="857.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle"><tspan x="857.5" y="820.4300000000001">Container Apps 内部环境</tspan><tspan x="857.5" y="847.03">VNet 集成；无公网业务入口</tspan><tspan x="857.5" y="873.63">服务使用 Managed Identity</tspan></text><text x="517.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" text-anchor="middle"><tspan x="517.5" y="671.26">私有 DNS 配置</tspan><tspan x="517.5" y="696.46">Private DNS Zones</tspan><tspan x="517.5" y="721.66">关联 VNet</tspan><tspan x="517.5" y="746.86">VPN 须解析私有域名</tspan><tspan x="517.5" y="772.06">必要时配置 DNS 转发</tspan></text><text x="185.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="middle"><tspan x="185.0" y="715.5300000000001">本地仍可保留</tspan><tspan x="185.0" y="742.13">加密备份 / 导出副本</tspan><tspan x="185.0" y="768.73"> </tspan><tspan x="185.0" y="795.33">VPN 不代替应用登录</tspan><tspan x="185.0" y="821.9300000000001">密码与恢复密钥</tspan><tspan x="185.0" y="848.5300000000001">不上云</tspan></text><text x="1255.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1255.0" y="412.77000000000004">Blob PE</tspan></text><text x="1840.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1840.0" y="397.74">Blob Storage</tspan><tspan x="1840.0" y="428.53999999999996">原文件 · 标准化资料 · 导出</tspan></text><text x="1255.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1255.0" y="522.77">PostgreSQL PE</tspan></text><text x="1840.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1840.0" y="507.74">PostgreSQL + pgvector</tspan><tspan x="1840.0" y="538.54">元数据 · 交易 · 检索索引</tspan></text><text x="1255.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1255.0" y="632.77">OCR PE</tspan></text><text x="1840.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1840.0" y="617.74">Document Intelligence</tspan><tspan x="1840.0" y="648.5400000000001">OCR · 表格 · 版面解析</tspan></text><text x="1255.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1255.0" y="742.77">OpenAI PE</tspan></text><text x="1840.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1840.0" y="727.74">Azure OpenAI</tspan><tspan x="1840.0" y="758.5400000000001">Embedding · 抽取 · 回答</tspan></text><text x="1255.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1255.0" y="852.77">Key Vault PE</tspan></text><text x="1840.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1840.0" y="837.74">Key Vault</tspan><tspan x="1840.0" y="868.5400000000001">密钥与必需的秘密</tspan></text><text x="875" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="start"><tspan x="875" y="568.33">入库任务</tspan></text><text x="1405" fill="#7852A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" text-anchor="start"><tspan x="1405" y="348.26">Private Link</tspan></text><text x="1125" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="start"><tspan x="1125" y="960.33">每项服务独立 PE</tspan></text><text x="1545" fill="#7852A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="start"><tspan x="1545" y="961.4">服务由微软运行；各服务数据面均关闭公网访问</tspan></text><text x="395.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="395.0" y="1130.8700000000001">身份边界</tspan><tspan x="395.0" y="1160.27">Entra ID：MFA / 用户令牌 / 服务身份</tspan><tspan x="395.0" y="1189.67">订阅 RBAC 与文档 ACL 分别执行</tspan></text><text x="1125.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1125.0" y="1130.8700000000001">网络约束</tspan><tspan x="1125.0" y="1160.27">私网入口 + 关闭服务公网 + 出站白名单</tspan><tspan x="1125.0" y="1189.67">平台依赖、DNS、登录及管理流量单独配置</tspan></text><text x="1860.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1860.0" y="1130.8700000000001">托管与地域约束</tspan><tspan x="1860.0" y="1160.27">PE 不代表服务商无法处理明文</tspan><tspan x="1860.0" y="1189.67">核对模型部署类型、OCR 留存与备份地域</tspan></text><text x="57" fill="#56667A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" text-anchor="start"><tspan x="57" y="1255.26">PostgreSQL 采用 Private Link 模式，非 VNet 注入。子网连线表示应用网络访问，不代表允许任意主体访问全部数据。</tspan></text></svg>