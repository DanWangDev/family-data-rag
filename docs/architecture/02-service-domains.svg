lyline points="1802.2804135906651,504.1946347717679 1807.5,515 1812.7195864093349,504.1946347717679" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="1807.5,625 1807.5,695" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1802.2804135906651,684.1946347717678 1807.5,695 1812.7195864093349,684.1946347717678" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="920.0,865 920.0,1000" fill="none" stroke="#24785A" stroke-width="2.2" stroke-linejoin="round" /><polyline points="914.7804135906653,989.1946347717678 920.0,1000 925.2195864093347,989.1946347717678" fill="none" stroke="#24785A" stroke-width="2.2" /><polyline points="1807.5,865 1807.5,1000" fill="none" stroke="#2563A6" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1802.2804135906651,989.1946347717678 1807.5,1000 1812.7195864093349,989.1946347717678" fill="none" stroke="#2563A6" stroke-width="2.2" /><polyline points="1255,1102.5 1410,1102.5" fill="none" stroke="#24785A" stroke-width="2.2" stroke-linejoin="round" /><polyline points="1399.1946347717678,1107.7195864093349 1410,1102.5 1399.1946347717678,1097.2804135906651" fill="none" stroke="#24785A" stroke-width="2.2" /><polyline points="585,802.0 520,802 520,1397.25 585,1397.25" fill="none" stroke="#7852A6" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="9 6" /><polyline points="574.1946347717678,1402.4695864093349 585,1397.25 574.1946347717678,1392.0304135906651" fill="none" stroke="#7852A6" stroke-width="2.2" /><polyline points="2205,802.0 2235,802 2235,1397.25 2205,1397.25" fill="none" stroke="#7852A6" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="9 6" /><polyline points="2215.805365228232,1392.0304135906651 2205,1397.25 2215.805365228232,1402.4695864093349" fill="none" stroke="#7852A6" stroke-width="2.2" /><text x="55" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" text-anchor="start"><tspan x="55" y="68.52000000000001">02 / 业务服务域与可迁移边界</tspan></text><text x="57" fill="#56667A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="start"><tspan x="57" y="118.47">逻辑服务域 ≠ 子网 ≠ 独立微服务    |    初期可部署为一个 API + 一个 Worker；Azure SDK 集中在供应商适配层</tspan></text><text x="75" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="75" y="275.54">访问与权限域</tspan></text><text x="605" fill="#24785A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="605" y="275.54">文档与证据域</tspan></text><text x="1430" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="1430" y="275.54">检索与问答域</tspan></text><text x="250.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="250.0" y="387.34000000000003">Web / API</tspan><tspan x="250.0" y="418.14">登录验证 · 上传 · 问答</tspan><tspan x="250.0" y="448.94">原文件与引用下载入口</tspan></text><text x="250.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="250.0" y="635.87">授权上下文 / 文档 ACL</tspan><tspan x="250.0" y="665.27">检索前过滤</tspan><tspan x="250.0" y="694.67">下载、缓存、统计同样校验权限</tspan></text><text x="920.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="920.0" y="382.74">导入 / 生命周期</tspan><tspan x="920.0" y="413.53999999999996">内容哈希 · 去重 · 快照 · 版本</tspan></text><text x="920.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="920.0" y="562.74">解析 / OCR 标准化</tspan><tspan x="920.0" y="593.5400000000001">文本 · 表格 · 页码 · 区域 · 置信度</tspan></text><text x="920.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="920.0" y="742.74">结构化事实 / 人工复核</tspan><tspan x="920.0" y="773.5400000000001">交易 · 金额 · 日期 · 纠正记录</tspan></text><text x="1807.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1807.5" y="382.74">索引构建与发布</tspan><tspan x="1807.5" y="413.53999999999996">切块 · Embedding · 全文索引 · 索引版本</tspan></text><text x="1807.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1807.5" y="562.74">查询执行：先权限与范围过滤</tspan><tspan x="1807.5" y="593.5400000000001">混合召回 · 重排 · 证据去重 · SQL 统计</tspan></text><text x="1807.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="1807.5" y="742.74">回答与引用</tspan><tspan x="1807.5" y="773.5400000000001">Token 预算 · 来源冲突 · 证据不足时拒答</tspan></text><text x="455" fill="#24785A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" text-anchor="start"><tspan x="455" y="370.33">导入任务</tspan></text><text x="1268" fill="#24785A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" text-anchor="start"><tspan x="1268" y="353.19">文档处理完成后</tspan><tspan x="1268" y="376.99">构建 / 发布索引</tspan></text><text x="605" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="start"><tspan x="605" y="898.4">带已验证身份与授权范围的查询</tspan></text><text x="605" fill="#24785A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="605" y="1040.54">权威数据  /  必须可导出</tspan></text><text x="920.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="920.0" y="1098.3700000000001">原文件 · 标准化 OCR / 表格 · 页码与坐标</tspan><tspan x="920.0" y="1127.77">权限 · 版本 · 事实 · 人工纠正</tspan><tspan x="920.0" y="1157.17">Blob + PostgreSQL；独立于 AI 供应商</tspan></text><text x="1430" fill="#2563A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="1430" y="1040.54">派生数据  /  允许重建</tspan></text><text x="1807.5" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" text-anchor="middle"><tspan x="1807.5" y="1098.3700000000001">Chunks · 向量 · 全文索引 · 索引 generation</tspan><tspan x="1807.5" y="1127.77">记录解析器、切块、Embedding 模型与版本</tspan><tspan x="1807.5" y="1157.17">更换 Embedding 模型通常需要重新计算向量</tspan></text><text x="1281" fill="#24785A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="start"><tspan x="1281" y="1081.4">可重建</tspan></text><text x="75" fill="#56667A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="75" y="1040.54">安全与运维域</tspan></text><text x="250.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="middle"><tspan x="250.0" y="1160.74">最小权限 / 托管身份</tspan><tspan x="250.0" y="1191.54">无正文日志 / 审计</tspan><tspan x="250.0" y="1222.3400000000001">删除与留存策略</tspan><tspan x="250.0" y="1253.14">备份 / 导出 / 恢复演练</tspan><tspan x="250.0" y="1283.94">评测集 / 成本与质量监测</tspan><tspan x="250.0" y="1314.74"> </tspan><tspan x="250.0" y="1345.54">横跨所有服务域</tspan></text><text x="605" fill="#7852A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" text-anchor="start"><tspan x="605" y="1330.54">供应商适配域  /  项目自己的接口；唯一集中依赖 Azure SDK 的层</tspan></text><text x="795.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle"><tspan x="795.0" y="1385.9">OCR Adapter</tspan><tspan x="795.0" y="1413.9">Document Intelligence</tspan></text><text x="1190.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle"><tspan x="1190.0" y="1385.9">Embedding Adapter</tspan><tspan x="1190.0" y="1413.9">Azure OpenAI</tspan></text><text x="1585.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle"><tspan x="1585.0" y="1385.9">LLM Adapter</tspan><tspan x="1585.0" y="1413.9">Azure OpenAI</tspan></text><text x="1980.0" fill="#243247" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="middle"><tspan x="1980.0" y="1385.9">Storage / Search Adapter</tspan><tspan x="1980.0" y="1413.9">Blob / PostgreSQL</tspan></text><text x="590" fill="#7852A6" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="start"><tspan x="590" y="1251.4">虚线：供应商调用依赖。业务域通过适配层访问托管服务；数据读写由各业务域按所有权执行。</tspan></text><text x="57" fill="#56667A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" text-anchor="start"><tspan x="57" y="1506.4">业务域表示职责与所有权，不自动产生网络或进程隔离。金额汇总由 SQL / 代码完成；模型负责抽取辅助与有证据的解释。</tspan></text></svg>